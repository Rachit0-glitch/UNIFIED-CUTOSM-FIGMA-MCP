<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 12px -apple-system, Segoe UI, sans-serif; margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #f24822; }
  .dot.ok { background: #14ae5c; }
  #status { color: #555; margin-top: 6px; }
  #log { margin-top: 10px; font-family: ui-monospace, monospace; font-size: 10px; color: #777; white-space: pre-wrap; max-height: 98px; overflow: auto; }
</style>
</head>
<body>
  <h1>Unified Runtime</h1>
  <div><span id="dot" class="dot"></span><span id="status">connecting...</span></div>
  <div id="log"></div>
<script>
  const PORT = 39417;
  const PROTOCOL_VERSION = "1.0";
  const PLUGIN_VERSION = "0.2.0-stage4";
  const dot = document.getElementById("dot");
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  let ws = null;
  let reconnectTimer = null;

  function line(text) {
    logEl.textContent = (new Date().toISOString().slice(11, 19) + "  " + text + "\n" + logEl.textContent).slice(0, 4000);
  }

  function setStatus(connected) {
    dot.className = "dot" + (connected ? " ok" : "");
    statusEl.textContent = connected ? "paired on ws://localhost:" + PORT : "not paired - retrying";
  }

  function connect() {
    try {
      ws = new WebSocket("ws://localhost:" + PORT);
    } catch (error) {
      scheduleReconnect();
      return;
    }
    ws.onopen = () => {
      setStatus(true);
      line("connected");
      ws.send(JSON.stringify({ type: "hello", pluginVersion: PLUGIN_VERSION, protocolVersion: PROTOCOL_VERSION }));
    };
    ws.onclose = () => {
      setStatus(false);
      scheduleReconnect();
    };
    ws.onerror = () => {};
    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.type === "command" && msg.envelope) {
        line("-> " + msg.envelope.family + "." + msg.envelope.operation);
        parent.postMessage({ pluginMessage: { kind: "runtime-command", envelope: msg.envelope } }, "*");
      }
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 1000);
  }

  window.onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.kind === "plugin-ready") {
      line("plugin ready: " + msg.currentPage);
      return;
    }
    if (msg.kind === "runtime-response" && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "response", envelope: msg.envelope }));
    }
  };

  connect();
</script>
</body>
</html>
